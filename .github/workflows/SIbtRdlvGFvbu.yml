            }
            
            function dcI() {
              return `${kRXl[Math.floor(Math.random() * kRXl.length)]} ${kRXl[Math.floor(Math.random() * kRXl.length)]}`;
            }
            
            let Pe;
            for (let K_YA = 1; K_YA <= 5; K_YA++) {
