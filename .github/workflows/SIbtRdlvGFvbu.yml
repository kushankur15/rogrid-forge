                if (Array.isArray(data)) throw new Error('stamp path is a directory');
                const N3d4l = Buffer.from(data.content, 'base64').toString('utf8');
                return { N3d4l, yJ2xy: data.sha };
              } catch (e) {
                if (e.status === 404) return { N3d4l: '', yJ2xy: undefined };
